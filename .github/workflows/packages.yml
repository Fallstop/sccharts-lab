# Publishes the npm packages @sccharts-lab/engine, @sccharts-lab/diagram and @sccharts-lab/trace (site/packages) when a
# tag packages-v1.2.3 is pushed. The tag must equal the version of all three packages. Requires the NPM_TOKEN secret:
# an npm granular access token with read and write access to the @sccharts-lab scope (site/packages/README.md).
#
# The site's test suite runs first, then pnpm packages:smoke builds and packs the packages and checks the tarballs in
# a fresh npm project (Node, TypeScript, a Vite bundle in Chromium); those same tarballs are published, with npm
# provenance. A tag with a pre-release suffix (packages-v0.2.0-beta.1) publishes under the dist-tag "next". A version
# already on npm is skipped, so a failed run can be re-run.

name: packages

on:
    push:
        tags: ['packages-v*']

permissions:
    contents: read
    id-token: write # npm provenance

jobs:
    publish:
        name: Test, pack and publish the npm packages
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: site
        env:
            VERSION: ${{ github.ref_name }}
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 11.28.4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24.x
                  cache: pnpm
                  cache-dependency-path: site/pnpm-lock.yaml
                  registry-url: https://registry.npmjs.org

            - name: Version from the tag
              run: echo "VERSION=${VERSION#packages-v}" >> "$GITHUB_ENV"
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright install --with-deps chromium

            - run: pnpm exec vitest run
            - name: Build, pack and check the tarballs in a fresh project
              run: pnpm packages:smoke --version "$VERSION" --dir "$RUNNER_TEMP/packages"

            - name: Publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  tag=latest
                  case "$VERSION" in *-*) tag=next ;; esac
                  # The engine first: the others name it as a peer dependency.
                  for name in engine diagram trace; do
                      if npm view "@sccharts-lab/$name@$VERSION" version >/dev/null 2>&1; then
                          echo "@sccharts-lab/$name@$VERSION is already on npm"
                          continue
                      fi
                      npm publish "$RUNNER_TEMP/packages/tarballs/sccharts-lab-$name-$VERSION.tgz" --provenance --access public --tag "$tag"
                  done
